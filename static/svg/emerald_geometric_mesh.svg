<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <defs>
    <pattern id="emeraldMosaic" width="240" height="240" patternUnits="userSpaceOnUse">
      <rect width="240" height="240" fill="#072015"/>
      <!-- Row 0 -->
      <polygon points="0,0 40,0 40,40" fill="#144630" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="0,0 0,40 40,40" fill="#28815a" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="40,0 80,0 80,40" fill="#0f3625" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="40,0 40,40 80,40" fill="#216c4b" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="80,0 120,0 120,40" fill="#30996b" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="80,0 80,40 120,40" fill="#184d35" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="120,0 160,0 160,40" fill="#1a573c" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="120,0 120,40 160,40" fill="#0b291c" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="160,0 200,0 200,40" fill="#39b07b" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="160,0 160,40 200,40" fill="#257652" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="200,0 240,0 240,40" fill="#144630" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="200,0 200,40 240,40" fill="#0f3625" stroke="#05170f" stroke-width="0.75"/>

      <!-- Row 1 -->
      <polygon points="0,40 40,40 0,80" fill="#0b291c" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="40,40 40,80 0,80" fill="#1a573c" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="40,40 80,40 40,80" fill="#257652" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="80,40 80,80 40,80" fill="#30996b" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="80,40 120,40 80,80" fill="#144630" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="120,40 120,80 80,80" fill="#072015" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="120,40 160,40 120,80" fill="#28815a" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="160,40 160,80 120,80" fill="#39b07b" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="160,40 200,40 160,80" fill="#0f3625" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="200,40 200,80 160,80" fill="#216c4b" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="200,40 240,40 200,80" fill="#184d35" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="240,40 240,80 200,80" fill="#257652" stroke="#05170f" stroke-width="0.75"/>

      <!-- Row 2 -->
      <polygon points="0,80 40,80 40,120" fill="#28815a" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="0,80 0,120 40,120" fill="#184d35" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="40,80 80,80 80,120" fill="#0f3625" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="40,80 40,120 80,120" fill="#39b07b" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="80,80 120,80 80,120" fill="#216c4b" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="120,80 120,120 80,120" fill="#144630" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="120,80 160,80 160,120" fill="#0b291c" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="120,80 120,120 160,120" fill="#257652" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="160,80 200,80 200,120" fill="#30996b" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="160,80 160,120 200,120" fill="#1a573c" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="200,80 240,80 240,120" fill="#072015" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="200,80 200,120 240,120" fill="#28815a" stroke="#05170f" stroke-width="0.75"/>

      <!-- Row 3 -->
      <polygon points="0,120 40,120 0,160" fill="#144630" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="40,120 40,160 0,160" fill="#30996b" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="40,120 80,120 40,160" fill="#1a573c" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="80,120 80,160 40,160" fill="#0b291c" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="80,120 120,120 80,160" fill="#39b07b" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="120,120 120,160 80,160" fill="#257652" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="120,120 160,120 120,160" fill="#184d35" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="160,120 160,160 120,160" fill="#0f3625" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="160,120 200,120 160,160" fill="#28815a" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="200,120 200,160 160,160" fill="#216c4b" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="200,120 240,120 200,160" fill="#144630" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="240,120 240,160 200,160" fill="#072015" stroke="#05170f" stroke-width="0.75"/>

      <!-- Row 4 -->
      <polygon points="0,160 40,160 40,200" fill="#216c4b" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="0,160 0,200 40,200" fill="#0f3625" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="40,160 80,160 80,200" fill="#39b07b" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="40,160 40,200 80,200" fill="#184d35" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="80,160 120,160 120,200" fill="#0b291c" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="80,160 80,200 120,200" fill="#28815a" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="120,160 160,160 160,200" fill="#30996b" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="120,160 120,200 160,200" fill="#144630" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="160,160 200,160 200,200" fill="#072015" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="160,160 160,200 200,200" fill="#257652" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="200,160 240,160 240,200" fill="#1a573c" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="200,160 200,200 240,200" fill="#39b07b" stroke="#05170f" stroke-width="0.75"/>

      <!-- Row 5 -->
      <polygon points="0,200 40,200 0,240" fill="#0b291c" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="40,200 40,240 0,240" fill="#257652" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="40,200 80,200 40,240" fill="#184d35" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="80,200 80,240 40,240" fill="#30996b" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="80,200 120,200 80,240" fill="#216c4b" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="120,200 120,240 80,240" fill="#144630" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="120,200 160,200 120,240" fill="#39b07b" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="160,200 160,240 120,240" fill="#0f3625" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="160,200 200,200 160,240" fill="#28815a" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="200,200 200,240 160,240" fill="#1a573c" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="200,200 240,200 200,240" fill="#072015" stroke="#05170f" stroke-width="0.75"/>
      <polygon points="240,200 240,240 200,240" fill="#257652" stroke="#05170f" stroke-width="0.75"/>

      <!-- Grid Overlay Lines for crisp definition -->
      <line x1="0" y1="40" x2="240" y2="40" stroke="rgba(255,255,255,0.06)" stroke-width="0.75"/>
      <line x1="0" y1="80" x2="240" y2="80" stroke="rgba(255,255,255,0.06)" stroke-width="0.75"/>
      <line x1="0" y1="120" x2="240" y2="120" stroke="rgba(255,255,255,0.06)" stroke-width="0.75"/>
      <line x1="0" y1="160" x2="240" y2="160" stroke="rgba(255,255,255,0.06)" stroke-width="0.75"/>
      <line x1="0" y1="200" x2="240" y2="200" stroke="rgba(255,255,255,0.06)" stroke-width="0.75"/>

      <line x1="40" y1="0" x2="40" y2="240" stroke="rgba(255,255,255,0.06)" stroke-width="0.75"/>
      <line x1="80" y1="0" x2="80" y2="240" stroke="rgba(255,255,255,0.06)" stroke-width="0.75"/>
      <line x1="120" y1="0" x2="120" y2="240" stroke="rgba(255,255,255,0.06)" stroke-width="0.75"/>
      <line x1="160" y1="0" x2="160" y2="240" stroke="rgba(255,255,255,0.06)" stroke-width="0.75"/>
      <line x1="200" y1="0" x2="200" y2="240" stroke="rgba(255,255,255,0.06)" stroke-width="0.75"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#emeraldMosaic)"/>
</svg>
