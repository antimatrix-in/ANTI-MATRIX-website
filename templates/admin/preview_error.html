<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preview Unavailable</title>
  <link rel="stylesheet" href="/static/css/main.css" />
  <link rel="stylesheet" href="/static/css/admin.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .error-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 2.5rem 2rem;
      max-width: 460px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }
    .error-icon {
      font-size: 2.75rem;
      margin-bottom: 1rem;
      display: inline-block;
      line-height: 1;
    }
    .error-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f8fafc;
      margin: 0 0 0.5rem 0;
    }
    .error-desc {
      font-size: 0.9rem;
      color: #94a3b8;
      line-height: 1.55;
      margin: 0 0 1.5rem 0;
    }
    .error-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0.55rem 1.1rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-download {
      background: #10b981;
      color: #ffffff;
      border: 1px solid #10b981;
    }
    .btn-download:hover {
      background: #059669;
      border-color: #059669;
    }
    .btn-retry {
      background: rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      border: 1px solid #475569;
    }
    .btn-retry:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border-color: #64748b;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-icon">⚠️</div>
    <h3 class="error-title">Preview Unavailable</h3>
    <p class="error-desc">
      The Offer Letter preview could not be generated right now.<br>
      Please try again or use <strong>Download DOCX</strong>.
    </p>
    <div class="error-actions">
      <a href="{{ download_url }}" class="btn-action btn-download" target="_top">
        Download DOCX
      </a>
      <button type="button" class="btn-action btn-retry" onclick="window.location.reload()">
        Try Again
      </button>
    </div>
  </div>
</body>
</html>
